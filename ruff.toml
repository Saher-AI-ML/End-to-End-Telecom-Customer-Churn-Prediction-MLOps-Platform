# ruff is a fast code checker. We only turn on the rules that find REAL problems:
#   E4, E7, E9 = syntax and basic statement errors
#   F          = unused imports/variables and undefined names
# (Newer ruff versions turn on many extra style rules by default, so we choose explicitly.)
line-length = 120
# Notebooks are for exploring, so they are not linted.
extend-exclude = ["*.ipynb"]

[lint]
select = ["E4", "E7", "E9", "F"]
